jobs:
  - kernel_include_regex: "^kernel_0$"
    kernel_iteration_range: "[3]"
    output_file: out
    output_format: [csv]
    truncate_kernels: true
    sys_trace: true
    advanced_thread_trace: true
    att_library_path: /opt/rocm/lib
    att_target_cu: 1
    att_shader_engine_mask: "0xf"
    att_simd_select: "0xf"
    att_gpu_index: "0"
    att_buffer_size: "0x6000000"
